<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>하비데이 · 스토어 이미지</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#183047;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}header,main{max-width:1600px;margin:auto;padding:36px 40px}header{padding-bottom:16px;display:flex;align-items:end;justify-content:space-between;gap:20px}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:700;color:#438dd9}h1{font-size:32px;letter-spacing:-1px;margin:9px 0}p{margin:0;color:#60778c;font-size:14px}.controls{display:flex;gap:8px;flex-wrap:wrap}button,.download{font:inherit;font-size:13px;padding:11px 16px;border:1px solid #d6e1eb;border-radius:99px;background:#fff;cursor:pointer;text-decoration:none;color:#304d68}button[aria-pressed=true]{background:#173b5e;color:#fff;border-color:#173b5e}.download{background:#5ba7f7;border-color:#5ba7f7;color:#fff}main{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:26px 22px;padding-top:18px}figure{margin:0}figure a{display:block;line-height:0;border-radius:14px;overflow:hidden;box-shadow:0 6px 24px #203e5711;background:#fff}img{display:block;width:100%;height:auto}figcaption{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13px;margin-top:11px;color:#3c566e}.num{color:#8a9fb1;font-size:11px}footer{padding:5px 40px 36px;max-width:1600px;margin:auto;font-size:12px;color:#6e8396}.contact header{padding-top:32px}.contact h1{font-size:29px}.contact .controls{display:none}.contact main{gap:24px 20px}.contact footer{padding-bottom:24px}
@media(max-width:1000px){main{grid-template-columns:repeat(3,minmax(0,1fr))}header{align-items:start;flex-direction:column}}@media(max-width:600px){header,main{padding-left:20px;padding-right:20px}main{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}h1{font-size:25px}footer{padding-left:20px;padding-right:20px}}
</style></head><body><header><div><div class="eyebrow">HOBIDAY · STORE COLLECTION</div><h1>함께 오르는 오늘, 하비데이</h1><p id="format-label">App Store · 1284 × 2778 px · 10장</p></div><div class="controls"><button data-format="appstore" aria-pressed="true">App Store</button><button data-format="playstore" aria-pressed="false">Google Play</button><a class="download" href="HobiDay-store-screenshots-2026-09-10.zip" download>전체 다운로드</a></div></header><main></main><footer>하비데이 주요 기능 10종 · 실제 앱 화면에 촬영용 예시 프로필과 대화를 사용했습니다.</footer>
<script>
const scenes=[['home','모임 찾기'],['search','장소 검색'],['session','모임 정보'],['people','사람 찾기'],['chat','1:1 대화'],['board','게시판'],['news','클라이밍 뉴스'],['videos','영상'],['records','완등 기록'],['shoe','암벽화 성장']];
const params=new URLSearchParams(location.search);if(params.has('contact'))document.body.classList.add('contact');
function show(format){const isPlay=format==='playstore',folder=isPlay?'playstore-1080x1920':'appstore-1284x2778';document.querySelector('#format-label').textContent=isPlay?'Google Play · 1080 × 1920 px · 10종 중 추천 8장 선택':'App Store · 1284 × 2778 px · 10장';document.querySelector('main').replaceChildren(...scenes.map(([name,title],i)=>{const n=String(i+1).padStart(2,'0'),src=folder+'/'+n+'-'+name+'.png',f=document.createElement('figure');f.innerHTML='<a href="'+src+'" target="_blank"><img src="'+src+'" alt="'+title+'"></a><figcaption>'+title+'<span class="num">'+n+'</span></figcaption>';return f}));document.querySelectorAll('button[data-format]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.format===format)))}document.querySelectorAll('button[data-format]').forEach(b=>b.onclick=()=>show(b.dataset.format));show(params.get('format')==='play'?'playstore':'appstore');
</script></body></html>
